# 场景文案：代码评审
#   附加行展示 MR 编号、标题与源→目标分支
.notify-msg-review:
  script:
    - |
      if [ "${NOTIFY_SCENARIO:-pipeline}" = "review" ]; then
        _SCN="代码评审"
        _EXTRA="\n【MR】!\${CI_MERGE_REQUEST_IID:-N/A} \${CI_MERGE_REQUEST_TITLE:-} (\${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-?} → \${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-?})"
        export _SCN _EXTRA
      fi
