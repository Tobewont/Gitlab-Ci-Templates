variables:
  # [用户可配] Harbor 推送执行镜像
  UPLOAD_HARBOR_IMAGE: "registry.example.com/library/docker:latest"
  # [用户可配] Harbor 推送开关
  UPLOAD_HARBOR_ENABLE: "true"

  # ── 镜像仓库 ────────────────────────────────────────────
  # [用户可配] 目标 registry。留空时回退 BUILD_DOCKER_REGISTRY，再回退 registry.example.com
  UPLOAD_HARBOR_REGISTRY: ""

  # ── 镜像信息 ─────────────────────────────────────────────────
  # [用户可配] 镜像名（不含 registry 前缀）
  UPLOAD_HARBOR_IMAGE_NAME: ""
  # [用户可配] 镜像 tag。留空则按优先级自动选：
  #   1. $CI_COMMIT_TAG        —— tag push 场景（如 v1.2.3）
  #   2. $CI_COMMIT_SHORT_SHA  —— 普通 push 场景（commit id 前 8 位）
  UPLOAD_HARBOR_IMAGE_TAG: ""
  # [用户可配] 是否额外推 :latest tag
  UPLOAD_HARBOR_PUSH_LATEST: "false"
  # [用户可配] 源镜像 tag（非空时先 docker tag SOURCE_REF DEST，再 push；用于跨仓库拷贝）
  UPLOAD_HARBOR_SOURCE_REF: ""
