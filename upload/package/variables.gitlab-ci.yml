variables:
  # [用户可配] 执行镜像（需含 curl）
  UPLOAD_PACKAGE_IMAGE: "$CI_BASE_IMAGE"
  # [用户可配] 上传开关
  UPLOAD_PACKAGE_ENABLE: "true"
  # [用户可配] 目标 Package Registry（默认当前 GitLab 项目；跨项目可覆盖 API URL）
  # 完整 URL 格式：$CI_API_V4_URL/projects/<id>/packages/generic/<package_name>/<version>/<file_name>
  UPLOAD_PACKAGE_API_URL: "$CI_API_V4_URL"
  UPLOAD_PACKAGE_PROJECT_ID: "$CI_PROJECT_ID"
  # [用户可配] 包名 / 版本 / 上传文件名（默认与本地文件同名）
  UPLOAD_PACKAGE_NAME: "$CI_PROJECT_NAME"
  UPLOAD_PACKAGE_VERSION: "$CI_COMMIT_REF_SLUG"
  UPLOAD_PACKAGE_FILE_NAME: ""
  # [用户可配] 本地文件路径（要上传的制品）
  UPLOAD_PACKAGE_LOCAL_PATH: ""
  # [用户可配] 认证 token（默认走 CI_JOB_TOKEN，跨项目可覆盖为 GITLAB_TOKEN）
  UPLOAD_PACKAGE_TOKEN_HEADER: "JOB-TOKEN"
  UPLOAD_PACKAGE_TOKEN: "$CI_JOB_TOKEN"
  # [用户可配] status 参数（default / hidden，Generic Packages API 特性）
  UPLOAD_PACKAGE_STATUS: "default"
