# 原子能力：Docker 镜像构建
# 两种姿势：
#   .docker-build      默认，通过 /var/run/docker.sock 直连宿主 docker daemon
#   .docker-build-dind 备用，走 docker:dind service
#
# BUILD_DOCKER_AUTO_PUSH=true 时构建后立即在同一 pod 内 login + push
# (推荐用法，避免 k8s 多节点 daemon 隔离问题);
# 若保持 false, push 由 upload/harbor/.harbor-push 独立完成。
# 仅在 push 成功后追加 ci-notify-artifacts.tsv（不含 :latest），供通知读取；
# 未 push、跳过、写入失败都不影响本 job 成功。子 job 若整体覆盖 artifacts.paths，则不会带上该文件。
include:
  - local: '/base/variables.gitlab-ci.yml'
  - local: '/base/jobs.gitlab-ci.yml'
  - local: '/build/docker/variables.gitlab-ci.yml'

stages:
  - build

# 默认：走宿主 docker.sock
.docker-build:
  extends: .base-job
  image: $BUILD_DOCKER_IMAGE
  stage: build
  variables:
    STEP_NAME: "Docker Build"
    STEP_ENABLE: "$BUILD_DOCKER_ENABLE"
  script:
    - |
      : > "${CI_PROJECT_DIR:-.}/ci-notify-artifacts.tsv" || true
      if [ "$STEP_ENABLE" != "true" ]; then
        echo "[skip] $STEP_NAME 未启用（BUILD_DOCKER_ENABLE=$STEP_ENABLE）"; exit 0
      fi
      if [ -z "$BUILD_DOCKER_IMAGE_NAME" ]; then
        echo "[skip] BUILD_DOCKER_IMAGE_NAME 未配置"; exit 0
      fi
      if [ ! -S /var/run/docker.sock ]; then
        echo "错误：/var/run/docker.sock 不存在，k8s runner 未挂载 docker.sock；请改用 .docker-build-dind"; exit 1
      fi

      # ── 解析 registry ──
      REGISTRY="${BUILD_DOCKER_REGISTRY:-registry.example.com}"
      REGISTRY="${REGISTRY#http://}"
      REGISTRY="${REGISTRY#https://}"
      REGISTRY="${REGISTRY%/}"
      if [ -z "$REGISTRY" ]; then
        echo "[fail] BUILD_DOCKER_REGISTRY 未配置"; exit 1
      fi
      echo "==> Registry: $REGISTRY"

      # ── Tag 策略：业务显式 > CI_COMMIT_TAG > commit message vX.Y.Z > CI_COMMIT_SHORT_SHA ──
      if [ -n "$BUILD_DOCKER_IMAGE_TAG" ]; then
        TAG="$BUILD_DOCKER_IMAGE_TAG"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG=""
        if [ "$BUILD_DOCKER_PARSE_COMMIT_VERSION" = "true" ] && [ -n "$CI_COMMIT_MESSAGE" ]; then
          # 匹配 "build v1.2.3" 或 "build 1.2.3"（不区分大小写）
          V=$(printf '%s' "$CI_COMMIT_MESSAGE" | grep -oiE '\bbuild[[:space:]]+v?[0-9]+(\.[0-9]+)+\b' | head -1 | awk '{print $NF}')
          if [ -n "$V" ]; then
            case "$V" in v*) TAG="$V" ;; *) TAG="v$V" ;; esac
          fi
        fi
        [ -z "$TAG" ] && TAG="$CI_COMMIT_SHORT_SHA"
      fi
      REF="${REGISTRY}/${BUILD_DOCKER_IMAGE_NAME}:${TAG}"

      echo "==> docker build $REF (context=$BUILD_DOCKER_CONTEXT dockerfile=$BUILD_DOCKER_FILE)"
      docker build \
        -f "${BUILD_DOCKER_CONTEXT}/${BUILD_DOCKER_FILE}" \
        -t "$REF" \
        $BUILD_DOCKER_BUILD_ARGS \
        $BUILD_DOCKER_EXTRA_ARGS \
        "$BUILD_DOCKER_CONTEXT"
      docker images "$REF"

      # ── AUTO_PUSH：build 完立即 login + push ──
      if [ "$BUILD_DOCKER_AUTO_PUSH" = "true" ]; then
        if [ -z "$HARBOR_PASSWORD" ]; then
          echo "[fail] HARBOR_PASSWORD 未配置（请在 GitLab CI/CD Variables 中 masked 注入）"; exit 1
        fi
        echo "==> docker login $REGISTRY ($HARBOR_USERNAME)"
        echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
        echo "==> docker push $REF"
        docker push "$REF"
        if [ "$BUILD_DOCKER_PUSH_LATEST" = "true" ]; then
          LATEST="${REGISTRY}/${BUILD_DOCKER_IMAGE_NAME}:latest"
          echo "==> docker tag & push $LATEST"
          docker tag "$REF" "$LATEST"
          docker push "$LATEST"
        fi
        _ci_notify_record_image() {
          _ref="$1"
          [ -n "$_ref" ] || return 0
          _host="${_ref%%/*}"
          _rest="${_ref#*/}"
          _name="${_rest%:*}"
          case "$_name" in
            */*) _proj="${_name%%/*}"; _repo="${_name#*/}" ;;
            *) _proj="library"; _repo="$_name" ;;
          esac
          _repo_enc=""
          _left="$_repo"
          while [ -n "$_left" ]; do
            case "$_left" in
              */*) _repo_enc="${_repo_enc}${_left%%/*}%2F"; _left="${_left#*/}" ;;
              *) _repo_enc="${_repo_enc}${_left}"; _left="" ;;
            esac
          done
          _url="https://${_host}/harbor/projects/${_proj}/repositories/${_repo_enc}/artifacts-tab"
          printf 'image\t%s\t%s\n' "$_ref" "$_url" >> "${CI_PROJECT_DIR:-.}/ci-notify-artifacts.tsv" || true
        }
        _ci_notify_record_image "$REF" || true
      fi
  artifacts:
    paths:
      - ci-notify-artifacts.tsv
    expire_in: 1 day
    when: on_success

# 备用：dind 方式
.docker-build-dind:
  extends: .base-job
  image: $BUILD_DOCKER_IMAGE
  stage: build
  services:
    - name: $BUILD_DOCKER_DIND_IMAGE
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
    STEP_NAME: "Docker Build (dind)"
    STEP_ENABLE: "$BUILD_DOCKER_ENABLE"
  script:
    - |
      : > "${CI_PROJECT_DIR:-.}/ci-notify-artifacts.tsv" || true
      if [ "$STEP_ENABLE" != "true" ]; then
        echo "[skip] $STEP_NAME 未启用（BUILD_DOCKER_ENABLE=$STEP_ENABLE）"; exit 0
      fi
      if [ -z "$BUILD_DOCKER_IMAGE_NAME" ]; then
        echo "[skip] BUILD_DOCKER_IMAGE_NAME 未配置"; exit 0
      fi

      REGISTRY="${BUILD_DOCKER_REGISTRY:-registry.example.com}"
      REGISTRY="${REGISTRY#http://}"
      REGISTRY="${REGISTRY#https://}"
      REGISTRY="${REGISTRY%/}"
      if [ -z "$REGISTRY" ]; then
        echo "[fail] BUILD_DOCKER_REGISTRY 未配置"; exit 1
      fi

      if [ -n "$BUILD_DOCKER_IMAGE_TAG" ]; then
        TAG="$BUILD_DOCKER_IMAGE_TAG"
      elif [ -n "$CI_COMMIT_TAG" ]; then
        TAG="$CI_COMMIT_TAG"
      else
        TAG=""
        if [ "$BUILD_DOCKER_PARSE_COMMIT_VERSION" = "true" ] && [ -n "$CI_COMMIT_MESSAGE" ]; then
          V=$(printf '%s' "$CI_COMMIT_MESSAGE" | grep -oiE '\bbuild[[:space:]]+v?[0-9]+(\.[0-9]+)+\b' | head -1 | awk '{print $NF}')
          if [ -n "$V" ]; then
            case "$V" in v*) TAG="$V" ;; *) TAG="v$V" ;; esac
          fi
        fi
        [ -z "$TAG" ] && TAG="$CI_COMMIT_SHORT_SHA"
      fi
      REF="${REGISTRY}/${BUILD_DOCKER_IMAGE_NAME}:${TAG}"

      echo "==> docker build (dind) $REF"
      docker build \
        -f "${BUILD_DOCKER_CONTEXT}/${BUILD_DOCKER_FILE}" \
        -t "$REF" \
        $BUILD_DOCKER_BUILD_ARGS \
        $BUILD_DOCKER_EXTRA_ARGS \
        "$BUILD_DOCKER_CONTEXT"

      if [ "$BUILD_DOCKER_AUTO_PUSH" = "true" ]; then
        if [ -z "$HARBOR_PASSWORD" ]; then
          echo "[fail] HARBOR_PASSWORD 未配置"; exit 1
        fi
        echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
        echo "==> docker push $REF"
        docker push "$REF"
        if [ "$BUILD_DOCKER_PUSH_LATEST" = "true" ]; then
          LATEST="${REGISTRY}/${BUILD_DOCKER_IMAGE_NAME}:latest"
          docker tag "$REF" "$LATEST"
          docker push "$LATEST"
        fi
        _ci_notify_record_image() {
          _ref="$1"
          [ -n "$_ref" ] || return 0
          _host="${_ref%%/*}"
          _rest="${_ref#*/}"
          _name="${_rest%:*}"
          case "$_name" in
            */*) _proj="${_name%%/*}"; _repo="${_name#*/}" ;;
            *) _proj="library"; _repo="$_name" ;;
          esac
          _repo_enc=""
          _left="$_repo"
          while [ -n "$_left" ]; do
            case "$_left" in
              */*) _repo_enc="${_repo_enc}${_left%%/*}%2F"; _left="${_left#*/}" ;;
              *) _repo_enc="${_repo_enc}${_left}"; _left="" ;;
            esac
          done
          _url="https://${_host}/harbor/projects/${_proj}/repositories/${_repo_enc}/artifacts-tab"
          printf 'image\t%s\t%s\n' "$_ref" "$_url" >> "${CI_PROJECT_DIR:-.}/ci-notify-artifacts.tsv" || true
        }
        _ci_notify_record_image "$REF" || true
      fi
  artifacts:
    paths:
      - ci-notify-artifacts.tsv
    expire_in: 1 day
    when: on_success
