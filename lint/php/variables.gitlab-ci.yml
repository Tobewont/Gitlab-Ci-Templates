variables:
  # [用户可配] PHP 静态检查执行镜像（内置 phpstan）
  LINT_PHP_IMAGE: "registry.example.com/cicd/phpstan/phpstan:v0.12.89"
  # [用户可配] PHPStan 开关
  LINT_PHP_PHPSTAN_ENABLE: "true"
  # [用户可配] PHPStan 配置文件（留空则用 phpstan.neon 默认）
  LINT_PHP_PHPSTAN_CONFIG: "phpstan.neon"
  # [用户可配] PHPStan 检测等级（0-9）
  LINT_PHP_PHPSTAN_LEVEL: "5"
