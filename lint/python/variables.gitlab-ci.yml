variables:
  # [用户可配] Python 静态检查执行镜像（内置 pylint）
  LINT_PY_IMAGE: "registry.example.com/cicd/pipelinecomponents/pylint:latest"
  # [用户可配] Pylint 开关
  LINT_PY_PYLINT_ENABLE: "true"
  # [用户可配] Pylint 配置文件（留空则不指定 rcfile）
  LINT_PY_PYLINT_CONFIG: ".pylintrc"
  # [用户可配] 附加 pip 依赖（空格分隔，如 rcfile 声明的 pylint 插件；留空跳过）
  LINT_PY_PYLINT_EXTRA_DEPS: ""
  # ── .pylint 产 Pylint 原生文本报告（供 .upload-sonar 转 Sonar externalIssues 消费）──
  # [用户可配] 是否产出 Pylint 原生文本报告（合并 stdout/stderr 经 tee 落盘，artifacts 供 .upload-sonar 消费）
  LINT_PY_PYLINT_SONAR_REPORT: "false"
  # [用户可配] Pylint 原生文本报告路径（.upload-sonar 的 QUALITY_UPLOAD_SONAR_INPUTS 用 pylint:<此路径> 引用）
  LINT_PY_PYLINT_SONAR_REPORT_PATH: "pylint-report.txt"
