workflow:
  # CI 配置防合并覆盖前提：MR 事件必须产生 MR 流水线（guard 仅存在于 MR 流水线）；
  #   分支有打开 MR 时去重分支流水线（保护卡在 MR 流水线，绕过分支流水线也无法合入）
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# 前端构建 → FTP 上传示例
include:
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'build/nodejs/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'upload/ftp/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'notify/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'checks/jobs.gitlab-ci.yml'

stages:
  - build
  - upload
  - notify

variables:
  # ── Node.js 构建能力变量
  BUILD_NODE_BUILD_CMD: "yarn build"

  # ── FTP 上传能力变量
  UPLOAD_FTP_HOSTNAME: "ftp.example.com"
  UPLOAD_FTP_USERNAME: "$FTP_USERNAME"  # 业务侧 CI/CD Variables 注入
  UPLOAD_FTP_PASSWORD: "$FTP_PASSWORD"
  UPLOAD_FTP_SRC_DIR: "dist"
  UPLOAD_FTP_DEST_DIR: "/var/www/app"

my-node-build:
  extends: .node-build

my-ftp-upload:
  extends: .ftp-upload
  needs:
    - my-node-build

my-notify:
  extends: .notify
  needs:
    - my-ftp-upload

# CI 配置防合并覆盖：MR 源分支改动 .gitlab-ci.yml 则 guard 失败、卡死合并（.pre 阶段，先于所有 job；guard 失败则后续 job 全部不启动）
#   默认启用（CHECKS_CI_CONFIG_GUARD_ENABLE: "true"）；显式设为 "false" 则 guard job 不创建、不作其它 job 前提（needs optional 自动豁免，零等待）
#   guard 仅在 MR 流水线存在（模板 rules 限定），故上方 workflow rules 必须放行 merge_request_event
ci-config-guard:
  extends: .ci-config-guard
