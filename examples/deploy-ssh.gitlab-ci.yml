workflow:
  # CI 配置防合并覆盖前提：MR 事件必须产生 MR 流水线（guard 仅存在于 MR 流水线）；
  #   分支有打开 MR 时去重分支流水线（保护卡在 MR 流水线，绕过分支流水线也无法合入）
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# SSH 部署示例：先 scp 上传制品 → 远程执行部署脚本
# SSH 私钥通过业务侧仓库的 GitLab CI/CD Variables（File 类型）注入到 $SSH_PRIVATE_KEY
include:
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'deploy/ssh/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'notify/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'checks/jobs.gitlab-ci.yml'

stages:
  - deploy
  - notify

variables:
  # ── SSH 部署变量
  DEPLOY_SSH_HOSTS: "192.168.1.10,192.168.1.11"
  DEPLOY_SSH_USERNAME: "deploy"
  DEPLOY_SSH_PRIVATE_KEY: "$SSH_PRIVATE_KEY"   # 业务侧在自己项目 CI/CD Variables 注入
  DEPLOY_SSH_UPLOAD_LOCAL: "dist/"
  DEPLOY_SSH_UPLOAD_REMOTE: "/var/www/app/"
  DEPLOY_SSH_COMMAND: "sudo systemctl restart nginx"

my-ssh-deploy:
  extends: .deploy-ssh

my-notify:
  extends: .notify
  needs:
    - my-ssh-deploy

# CI 配置防合并覆盖：MR 源分支改动 .gitlab-ci.yml 则 guard 失败、卡死合并（.pre 阶段，先于所有 job；guard 失败则后续 job 全部不启动）
#   默认启用（CHECKS_CI_CONFIG_GUARD_ENABLE: "true"）；显式设为 "false" 则 guard job 不创建、不作其它 job 前提（needs optional 自动豁免，零等待）
#   guard 仅在 MR 流水线存在（模板 rules 限定），故上方 workflow rules 必须放行 merge_request_event
ci-config-guard:
  extends: .ci-config-guard
