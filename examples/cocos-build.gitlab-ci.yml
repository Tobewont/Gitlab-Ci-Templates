workflow:
  # CI 配置防合并覆盖前提：MR 事件必须产生 MR 流水线（guard 仅存在于 MR 流水线）；
  #   分支有打开 MR 时去重分支流水线（保护卡在 MR 流水线，绕过分支流水线也无法合入）
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# Cocos Creator 游戏构建 → OSS 上传 → 通知
# 依赖 tags: [cocos] 的专用 runner（.cocos-build 已内置该 tag）；业务侧需在该 runner 环境预装 Cocos Creator
include:
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'build/cocos/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'upload/oss/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'notify/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'checks/jobs.gitlab-ci.yml'

stages:
  - build
  - upload
  - notify

variables:
  # ── 统一业务变量（只改此区）
  APP_ARTIFACT_DIR: "build"

  # ── Cocos 构建能力变量
  BUILD_COCOS_IMAGE: "registry.example.com/cicd/cocos/creator:3.8"
  BUILD_COCOS_BINARY: "/opt/CocosCreator/CocosCreator"
  BUILD_COCOS_CONFIG_PATH: "settings/v2/packages/builder.json"
  BUILD_COCOS_ARTIFACT_PATH: "$APP_ARTIFACT_DIR"

  # ── OSS 上传能力变量
  UPLOAD_OSS_ENDPOINT: "oss-cn-hangzhou.aliyuncs.com"
  UPLOAD_OSS_BASE_URL: "oss://my-bucket/game/${CI_PROJECT_NAME}"
  UPLOAD_OSS_LOCAL_PATH: "$APP_ARTIFACT_DIR"
  UPLOAD_OSS_RECURSIVE: "true"

my-cocos-build:
  extends: .cocos-build

my-oss-upload:
  extends: .oss-upload
  stage: upload
  needs:
    - my-cocos-build

my-notify:
  extends: .notify
  needs:
    - my-oss-upload

# CI 配置防合并覆盖：MR 源分支改动 .gitlab-ci.yml 则 guard 失败、卡死合并（.pre 阶段，先于所有 job；guard 失败则后续 job 全部不启动）
#   默认启用（CHECKS_CI_CONFIG_GUARD_ENABLE: "true"）；显式设为 "false" 则 guard job 不创建、不作其它 job 前提（needs optional 自动豁免，零等待）
#   guard 仅在 MR 流水线存在（模板 rules 限定），故上方 workflow rules 必须放行 merge_request_event
ci-config-guard:
  extends: .ci-config-guard
