workflow:
  # CI 配置防合并覆盖前提：MR 事件必须产生 MR 流水线（guard 仅存在于 MR 流水线）；
  #   分支有打开 MR 时去重分支流水线（保护卡在 MR 流水线，绕过分支流水线也无法合入）
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# Windows 专用 runner 示例：MSBuild 编译 + .bat 打包 + 通知
# 依赖 tags: [windows] 的专用 shell runner（能力已内置）
include:
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'build/windows/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'notify/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'checks/jobs.gitlab-ci.yml'

stages:
  - build
  - package
  - notify

variables:
  # ── 统一业务变量（只改此区）
  WINDOWS_BUILD_CONFIGURATION: "Release"
  WINDOWS_BUILD_PLATFORM: "x64"

  # ── MSBuild 变量
  BUILD_MSBUILD_SOLUTION: "src/MyApp.sln"
  BUILD_MSBUILD_CONFIGURATION: "$WINDOWS_BUILD_CONFIGURATION"
  BUILD_MSBUILD_PLATFORM: "$WINDOWS_BUILD_PLATFORM"
  # 若需要预加载 Visual Studio 开发者环境（VS2019 例），指定 vsdevcmd.bat 全路径
  BUILD_MSBUILD_VSDEVCMD: "C:\\Program Files (x86)\\Microsoft Visual Studio\\2019\\BuildTools\\Common7\\Tools\\VsDevCmd.bat"

  # ── Windows .bat 打包变量
  BUILD_WIN_BAT_SCRIPT: "CI\\package.bat"
  BUILD_WIN_BAT_ARGS: "$WINDOWS_BUILD_CONFIGURATION $WINDOWS_BUILD_PLATFORM"

my-msbuild:
  extends: .msbuild

my-package:
  extends: .windows-bat
  stage: package
  needs:
    - my-msbuild

my-notify:
  extends: .notify
  needs:
    - my-package

# CI 配置防合并覆盖：MR 源分支改动 .gitlab-ci.yml 则 guard 失败、卡死合并（.pre 阶段，先于所有 job；guard 失败则后续 job 全部不启动）
#   默认启用（CHECKS_CI_CONFIG_GUARD_ENABLE: "true"）；显式设为 "false" 则 guard job 不创建、不作其它 job 前提（needs optional 自动豁免，零等待）
#   guard 仅在 MR 流水线存在（模板 rules 限定），故上方 workflow rules 必须放行 merge_request_event
ci-config-guard:
  extends: .ci-config-guard
