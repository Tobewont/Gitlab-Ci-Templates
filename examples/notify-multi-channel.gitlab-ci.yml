workflow:
  # CI 配置防合并覆盖前提：MR 事件必须产生 MR 流水线（guard 仅存在于 MR 流水线）；
  #   分支有打开 MR 时去重分支流水线（保护卡在 MR 流水线，绕过分支流水线也无法合入）
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# 多渠道通知示例：展示两种用法
# 用法 1: 聚合入口 .notify + 多值 NOTIFY_CHANNEL（一个 job 串行发送多个渠道）
# 用法 2: 独立能力 .notify-feishu / .notify-wework / ...（多个 job 并发发送，可放不同 stage）
# 飞书、企微、钉钉、通用 webhook 都是机器人直连，地址经 CI/CD Variables masked 注入。
include:
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'lint/python/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'notify/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'notify/wework/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'checks/jobs.gitlab-ci.yml'

stages:
  - lint
  - notify

variables:
  # NOTIFY_FEISHU_WEBHOOK_URL / NOTIFY_FEISHU_SIGN_SECRET 经 CI/CD Variables masked 注入。

  # ── 企微通知变量
  # NOTIFY_WEWORK_WEBHOOK_URL 经业务侧 CI/CD Variables masked 注入。
  NOTIFY_WEWORK_WEBHOOK_URL: "$NOTIFY_WEWORK_WEBHOOK_URL"
  NOTIFY_WEWORK_MENTIONED_MOBILES: "@all"

my-pylint:
  extends: .pylint

# 用法 1：一个 job 串行发到飞书 + 企微（best-effort，某渠道失败不影响其他）
my-notify:
  extends: .notify
  variables:
    NOTIFY_CHANNEL: "feishu,wework"
  needs:
    - job: my-pylint
      optional: true

# 用法 2：独立能力，与 my-notify 并发发送到企微
my-notify-wework:
  extends: .notify-wework
  needs:
    - job: my-pylint
      optional: true

# CI 配置防合并覆盖：MR 源分支改动 .gitlab-ci.yml 则 guard 失败、卡死合并（.pre 阶段，先于所有 job；guard 失败则后续 job 全部不启动）
#   默认启用（CHECKS_CI_CONFIG_GUARD_ENABLE: "true"）；显式设为 "false" 则 guard job 不创建、不作其它 job 前提（needs optional 自动豁免，零等待）
#   guard 仅在 MR 流水线存在（模板 rules 限定），故上方 workflow rules 必须放行 merge_request_event
ci-config-guard:
  extends: .ci-config-guard
