workflow:
  # CI 配置防合并覆盖前提：MR 事件必须产生 MR 流水线（guard 仅存在于 MR 流水线）；
  #   分支有打开 MR 时去重分支流水线（保护卡在 MR 流水线，绕过分支流水线也无法合入）
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

# 下载原子能力示例：三选一实例化，均输出统一 DOWNLOAD_* dotenv 和 JSON manifest
include:
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'download/gitlab/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'download/oss/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'download/package/jobs.gitlab-ci.yml'
  - project: 'group/gitlab-ci-templates'
    ref: stable
    file: 'checks/jobs.gitlab-ci.yml'

stages:
  - download

download-from-gitlab:
  extends: .gitlab-download
  variables:
    DOWNLOAD_GITLAB_TYPE: "directory"
    DOWNLOAD_GITLAB_REPO_URL: "https://git.example.com/group/artifacts.git"
    DOWNLOAD_GITLAB_BRANCH: "test"
    DOWNLOAD_GITLAB_PATHS: "bin/Release"

download-from-oss:
  extends: .oss-download
  variables:
    DOWNLOAD_OSS_TYPE: "file"
    DOWNLOAD_OSS_BASE_URL: "oss://bucket/project"
    DOWNLOAD_OSS_PATHS: "bin/Debug/a.so,bin/Release/a.so"

download-from-package:
  extends: .package-download
  variables:
    DOWNLOAD_PACKAGE_TYPE: "file"
    DOWNLOAD_PACKAGE_PROJECT_ID: "123"
    DOWNLOAD_PACKAGE_NAME: "my-lib"
    DOWNLOAD_PACKAGE_VERSION: "1.2.3"
    DOWNLOAD_PACKAGE_PATHS: "bin/Debug/mylib-debug.so,bin/Release/mylib.so"

# CI 配置防合并覆盖：MR 源分支改动 .gitlab-ci.yml 则 guard 失败、卡死合并（.pre 阶段，先于所有 job；guard 失败则后续 job 全部不启动）
#   默认启用（CHECKS_CI_CONFIG_GUARD_ENABLE: "true"）；显式设为 "false" 则 guard job 不创建、不作其它 job 前提（needs optional 自动豁免，零等待）
#   guard 仅在 MR 流水线存在（模板 rules 限定），故上方 workflow rules 必须放行 merge_request_event
ci-config-guard:
  extends: .ci-config-guard
