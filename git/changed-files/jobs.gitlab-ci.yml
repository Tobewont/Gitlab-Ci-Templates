# 原子能力：变更文件检测（取变更文件 / 过滤 / 目录推断）
include:
  - local: '/base/variables.gitlab-ci.yml'
  - local: '/base/jobs.gitlab-ci.yml'
  - local: '/git/changed-files/variables.gitlab-ci.yml'

# ── 获取变更文件 ─────────────────────────────────────────────────
# 取值优先级：CI_CHANGED_FILES 已有值（上游 .changes dotenv 或预定义变量）→
# MR 走 GitLab API /merge_requests/{iid}/changes → 无 .git 工作副本置空跳过 →
# push/tag 用 previousCommit=HEAD^（浅克隆先 unshallow/deepen）+ git diff 两点。
# 结果导出到 CI_CHANGED_FILES。
.get-changed-files:
  before_script:
    - export LC_ALL="$CI_LOCALE"; export LANG="$CI_LOCALE"
    - |
      set +e
      # 确保 git/curl 可用：apk (alpine) 或 apt-get (debian/ubuntu)，均支持 USE_CHINA_MIRROR 换阿里云源
      if ! command -v git >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          # 默认换阿里云 alpine 源（USE_CHINA_MIRROR=false 关闭）
          if [ "${USE_CHINA_MIRROR:-true}" = "true" ] && [ -f /etc/apk/repositories ]; then
            sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories 2>/dev/null || true
          fi
          apk add --no-cache git curl >/dev/null 2>&1
        elif command -v apt-get >/dev/null 2>&1; then
          # 默认换阿里云 debian/ubuntu 源（USE_CHINA_MIRROR=false 关闭）
          if [ "${USE_CHINA_MIRROR:-true}" = "true" ] && [ -f /etc/apt/sources.list ]; then
            sed -i 's|deb.debian.org|mirrors.aliyun.com|g; s|security.debian.org|mirrors.aliyun.com|g; s|archive.ubuntu.com|mirrors.aliyun.com|g; s|security.ubuntu.com|mirrors.aliyun.com|g' /etc/apt/sources.list 2>/dev/null || true
          fi
          apt-get update -qq >/dev/null 2>&1 && apt-get install -y -qq git curl >/dev/null 2>&1
        fi
      fi
      if ! command -v curl >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache curl >/dev/null 2>&1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get install -y -qq curl >/dev/null 2>&1
        fi
      fi
      if [ -n "$CI_CHANGED_FILES" ]; then
        echo "变更来源：CI_CHANGED_FILES 已有值（上游 .changes dotenv 或预定义变量）"
      elif [ -n "$CI_MERGE_REQUEST_IID" ]; then
        echo "变更来源：MR API (iid=$CI_MERGE_REQUEST_IID)"
        command -v curl >/dev/null 2>&1 || { echo "[error] curl 不可用（镜像未内置且安装失败），无法调用 MR API"; exit 1; }
        API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/changes"
        RESP=$(curl -s --connect-timeout 30 --max-time 120 -H "PRIVATE-TOKEN: $GIT_CHANGED_FILES_TOKEN" -H "Accept: application/json" "$API")
        # 排除已删除文件：MR changes 中 deleted_file:true 的条目 new_path 仍保留旧路径，
        # 若下发给 lint/prettier 会因文件不存在而报错卡合并。按对象拆分后跳过删除项。
        CI_CHANGED_FILES=$(printf '%s' "$RESP" | sed 's/},{/}\n{/g' | awk '/"new_path"/ { if ($0 ~ /"deleted_file":true/) next; line=$0; sub(/.*"new_path":"/,"",line); sub(/".*/,"",line); if (line != "") print line }')
      elif [ ! -d .git ]; then
        # GIT_STRATEGY=none 的 job 没有工作副本，无法计算变更范围。
        # 此类 job 按显式清单处理文件、不消费 CI_CHANGED_FILES，故置空跳过。
        echo "[skip] 无 git 工作副本（GIT_STRATEGY=none），跳过变更文件检测"
        CI_CHANGED_FILES=""
      else
        # push / tag：优先覆盖整个 push 范围；tag 或基准不可用时回退 HEAD^
        command -v git >/dev/null 2>&1 || { echo "[error] git 不可用（镜像未内置且安装失败），无法计算变更范围"; exit 1; }
        if [ -f .git/shallow ]; then
          git fetch --unshallow origin >/dev/null 2>&1 || git fetch --deepen=50 origin "$CI_COMMIT_REF_NAME" >/dev/null 2>&1 || true
        fi
        ZERO_SHA=0000000000000000000000000000000000000000
        PREV=${CI_COMMIT_BEFORE_SHA:-}
        FIRST_PUSH=false
        if [ "$PREV" = "$ZERO_SHA" ]; then
          FIRST_PUSH=true
          PREV=""
        fi
        if [ -n "$PREV" ] && ! git cat-file -e "$PREV^{commit}" 2>/dev/null; then
          git fetch --no-tags origin "$PREV" >/dev/null 2>&1 || {
            echo "[error] 无法获取 push 起点 $PREV，拒绝按不完整范围继续"
            exit 1
          }
        fi
        if [ "$FIRST_PUSH" != "true" ] && [ -z "$PREV" ]; then
          PREV=$(git rev-parse "${CI_COMMIT_SHA}^" 2>/dev/null)
        fi
        if [ -z "$PREV" ]; then
          git fetch --deepen=50 origin "$CI_COMMIT_REF_NAME" >/dev/null 2>&1
          PREV=$(git rev-parse "${CI_COMMIT_SHA}^" 2>/dev/null)
        fi
        if [ -z "$PREV" ]; then
          TARGET="${CI_DEFAULT_BRANCH:-main}"
          git fetch origin "$TARGET" >/dev/null 2>&1
          PREV=$(git rev-parse "origin/$TARGET" 2>/dev/null)
        fi
        if [ "$FIRST_PUSH" = "true" ]; then
          # 首次 push 不列全仓文件：改取与默认分支的差异，只下发改分支相对
          # 默认分支引入的变更，避免下游按文件过滤的检查（vet/lint/合规）
          # 把全仓历史问题当成新增问题。默认分支自身的首次 push（新仓库
          # 初始推送）与基准获取失败时，退化为全仓文件列表。
          TARGET="${CI_DEFAULT_BRANCH:-main}"
          FIRST_PUSH_BASE=""
          if [ "$CI_COMMIT_REF_NAME" != "$TARGET" ] && git fetch --no-tags origin "+refs/heads/$TARGET:refs/remotes/origin/$TARGET" >/dev/null 2>&1; then
            FIRST_PUSH_BASE=$(git rev-parse --verify -q "origin/$TARGET" 2>/dev/null || true)
          fi
          if [ -n "$FIRST_PUSH_BASE" ] && [ "$FIRST_PUSH_BASE" != "$CI_COMMIT_SHA" ]; then
            echo "变更来源：分支首次 push，与默认分支 $TARGET 差异（$FIRST_PUSH_BASE..$CI_COMMIT_SHA）"
            CI_CHANGED_FILES=$(git -c core.quotepath=false diff --name-only --diff-filter=d "$FIRST_PUSH_BASE" "$CI_COMMIT_SHA" 2>/dev/null)
          else
            echo "变更来源：分支首次 push，列出当前版本全部文件"
            CI_CHANGED_FILES=$(git -c core.quotepath=false ls-tree -r --name-only "$CI_COMMIT_SHA" 2>/dev/null)
          fi
        elif [ -n "$PREV" ]; then
          echo "变更来源：git diff $PREV..$CI_COMMIT_SHA"
          CI_CHANGED_FILES=$(git -c core.quotepath=false diff --name-only --diff-filter=d "$PREV" "$CI_COMMIT_SHA" 2>/dev/null)
        else
          echo "警告：无法确定基准 commit，改列出本次 commit 变更文件"
          CI_CHANGED_FILES=$(git -c core.quotepath=false diff-tree --no-commit-id --name-only --diff-filter=d -r "$CI_COMMIT_SHA" 2>/dev/null)
        fi
      fi
      set -e
      export CI_CHANGED_FILES
      echo "变更文件列表："
      echo "$CI_CHANGED_FILES"
# ── 变更文件统一计算 job ─────────────────────────────────────────
# stage .pre 执行一次，CI_CHANGED_FILES 以空格分隔写入 dotenv 下发；
# 下游 job 的 .get-changed-files 检测到已有值时自动跳过重复计算。
# 用法：changes: { extends: .changes }，下游 job needs: [changes]
.changes:
  extends: .base-job
  stage: .pre
  before_script:
    - !reference [.get-changed-files, before_script]
  script:
    - echo "CI_CHANGED_FILES=$(printf '%s\n' "$CI_CHANGED_FILES" | paste -sd' ')" >> changed_files.env
  artifacts:
    reports:
      dotenv: changed_files.env
# ── 按扩展名过滤变更文件（片段）────────────────────────────────────
# 输入：CI_CHANGED_FILES、STEP_FILE_GLOB；输出：STEP_MATCHED_FILES
# 复用：- !reference [.filter-changed-files, script]
# 输入：CI_CHANGED_FILES / STEP_FILE_GLOB（ERE 正则，如 '\.(js|ts)$'）
#      / STEP_FILE_EXCLUDE（可选 ERE 正则，命中则排除，如 '/(public|mock|\.vscode)/'）
# 输出：STEP_MATCHED_FILES
.filter-changed-files:
  script:
    - |
      STEP_MATCHED_FILES=$(echo "$CI_CHANGED_FILES" | grep -E "${STEP_FILE_GLOB:-.}" || true)
      if [ -n "$STEP_FILE_EXCLUDE" ] && [ -n "$STEP_MATCHED_FILES" ]; then
        STEP_MATCHED_FILES=$(echo "$STEP_MATCHED_FILES" | grep -Ev "$STEP_FILE_EXCLUDE" || true)
      fi
      # STEP_FILTER_EXISTING=true 时仅保留工作区中真实存在的文件，避免删除/改名等残留路径
      # 传入按文件粒度执行的检查工具（eslint/prettier 等）导致 file not found 报错卡合并。
      if [ "$STEP_FILTER_EXISTING" = "true" ] && [ -n "$STEP_MATCHED_FILES" ]; then
        STEP_MATCHED_FILES=$(echo "$STEP_MATCHED_FILES" | while IFS= read -r _f; do [ -n "$_f" ] && [ -f "$_f" ] && echo "$_f"; done)
      fi
      export STEP_MATCHED_FILES
      if [ -z "$STEP_MATCHED_FILES" ]; then
        echo "[skip] ${STEP_NAME:-该能力}：无匹配的变更文件（${STEP_FILE_GLOB:-*}）"
        [ -n "$STEP_ARTIFACT" ] && echo '[]' > "$STEP_ARTIFACT"
        exit 0
      fi
  rules:
    - !reference [.workflow-rules, rules]

# 从变更文件推断变更的顶层目录（monorepo 判断哪些子模块需要构建）
# 输入：CI_CHANGED_FILES（.get-changed-files 已导出）+ GIT_CHANGED_FILES_FOLDER_DEPTH（默认 1，顶层目录）
# 输出：CI_CHANGED_FOLDERS（去重，逗号分隔）
.get-changed-folders:
  script:
    - |
      if [ -z "$CI_CHANGED_FILES" ]; then
        echo "无 CI_CHANGED_FILES，先 extends .get-changed-files"; exit 0
      fi
      DEPTH="${GIT_CHANGED_FILES_FOLDER_DEPTH:-1}"
      CI_CHANGED_FOLDERS=$(printf '%s\n' "$CI_CHANGED_FILES" | awk -F/ -v d="$DEPTH" 'NF>=d && $1!="" { p=$1; for(i=2;i<=d;i++) p=p"/"$i; print p }' | sort -u | paste -sd,)
      export CI_CHANGED_FOLDERS
      echo "变更目录（depth=$DEPTH）：$CI_CHANGED_FOLDERS"
