# 原子能力：GitLeaks 敏感信息扫描
include:
  - local: '/base/variables.gitlab-ci.yml'
  - local: '/base/jobs.gitlab-ci.yml'
  - local: '/common/variables.gitlab-ci.yml'
  - local: '/common/jobs.gitlab-ci.yml'
  - local: '/security/gitleaks/variables.gitlab-ci.yml'

stages:
  - security

# GitLeaks 敏感信息扫描
.gitleaks:
  extends: .base-job
  image: $SEC_GITLEAKS_IMAGE
  stage: security
  needs:
    - job: ci-config-guard
      optional: true
  allow_failure: true
  variables:
    STEP_NAME: "GitLeaks"
    STEP_ENABLE: "$SEC_GITLEAKS_ENABLE"
  script:
    - !reference [.skip-if-disabled, script]
    - |
      CFG_ARG=""
      [ -n "$SEC_GITLEAKS_CONFIG" ] && [ -f "$SEC_GITLEAKS_CONFIG" ] && CFG_ARG="--config $SEC_GITLEAKS_CONFIG"
      gitleaks detect \
        --no-git \
        --source . \
        --report-format json \
        --report-path gitleaks-report.json \
        --exit-code "$SEC_GITLEAKS_EXIT_CODE" \
        $CFG_ARG
      cat gitleaks-report.json 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: "7 days"
