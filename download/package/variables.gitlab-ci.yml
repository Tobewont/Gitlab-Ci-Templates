variables:
  DOWNLOAD_PACKAGE_ENABLE: "true"
  DOWNLOAD_PACKAGE_IMAGE: "$CI_BASE_IMAGE"
  DOWNLOAD_PACKAGE_TYPE: "file"
  DOWNLOAD_PACKAGE_API_URL: "$CI_API_V4_URL"
  DOWNLOAD_PACKAGE_PROJECT_ID: "$CI_PROJECT_ID"
  DOWNLOAD_PACKAGE_NAME: "$CI_PROJECT_NAME"
  DOWNLOAD_PACKAGE_VERSION: "$CI_COMMIT_REF_SLUG"
  DOWNLOAD_PACKAGE_TOKEN_HEADER: "JOB-TOKEN"
  DOWNLOAD_PACKAGE_TOKEN: "$CI_JOB_TOKEN"
  # file: 逗号分隔文件路径；manifest: 读取本地 manifest 的 files 数组逐个下载
  # 说明：Generic Package Registry 无目录枚举接口，故用 manifest 代替 directory
  DOWNLOAD_PACKAGE_PATHS: ""
  DOWNLOAD_PACKAGE_MANIFEST_FILE: ""
  DOWNLOAD_PACKAGE_DEST_DIR: ".downloads/package"
  DOWNLOAD_PACKAGE_CONNECT_TIMEOUT: "10"
  DOWNLOAD_PACKAGE_REQUEST_TIMEOUT: "600"
  DOWNLOAD_PACKAGE_RETRY_COUNT: "3"
  DOWNLOAD_PACKAGE_MAX_FILES: "1000"
  DOWNLOAD_PACKAGE_MAX_FILE_BYTES: "1073741824"
  DOWNLOAD_PACKAGE_MAX_TOTAL_BYTES: "2147483648"
  DOWNLOAD_PACKAGE_DOTENV_FILE: "download-package.env"
  DOWNLOAD_PACKAGE_OUTPUT_MANIFEST: "download-package.json"
